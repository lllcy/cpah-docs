name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version $version"
          }

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and verify release
        run: npm run release

      - name: Attest executable provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: release/CPAH-Docs-*.exe

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v7
        with:
          name: cpah-docs-windows
          path: release/

  macos:
    name: Build macOS universal release
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(node -e 'const fs = require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync("package.json", "utf8")).version)')"
          if [[ "v$version" != "${{ github.ref_name }}" ]]; then
            echo "Tag ${{ github.ref_name }} does not match package version $version" >&2
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and verify release
        run: npm run release

      - name: Attest DMG provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: release/CPAH-Docs-*.dmg

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v7
        with:
          name: cpah-docs-macos
          path: release/

  publish:
    name: Publish GitHub Release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: cpah-docs-windows
          path: artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: cpah-docs-macos
          path: artifacts/macos

      - name: Assemble and verify release assets
        shell: bash
        run: |
          mkdir release
          cp artifacts/windows/CPAH-Docs-*.exe release/
          cp artifacts/macos/CPAH-Docs-*.dmg release/
          cat artifacts/windows/SHA256SUMS.txt artifacts/macos/SHA256SUMS.txt > release/SHA256SUMS.txt
          cd release
          sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/CPAH-Docs-*.exe \
            release/CPAH-Docs-*.dmg \
            release/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --title "CPAH Docs ${{ github.ref_name }}" \
            --generate-notes
