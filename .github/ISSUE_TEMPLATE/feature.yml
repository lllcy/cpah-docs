name: Feature request / 功能建议
description: Suggest a concrete improvement / 建议一个明确、可验证的改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve / 需要解决的问题
      description: Describe the user scenario. English or Chinese is welcome. / 请描述用户场景，欢迎中文或英文。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 已考虑的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: Before submitting / 提交前确认
      options:
        - label: I searched existing issues for duplicates. / 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: No real documents, credentials or private data are included. / 内容不包含真实文档、凭据或个人隐私。
          required: true
