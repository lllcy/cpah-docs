name: Bug 报告
description: 报告可以稳定复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传真实业务文档、Token、API Key、数据库、完整日志或包含个人完整路径的截图。
  - type: input
    id: version
    attributes:
      label: CPAH Docs 版本
      placeholder: 例如 1.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题范围
      options:
        - 目录监听
        - 格式转换
        - MinerU
        - Agent 分类
        - Markdown 索引
        - 界面或其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请使用不含敏感信息的最小示例。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏诊断信息
      description: 可从帮助页复制诊断信息；再次确认其中没有秘密或业务正文。
    validations:
      required: true
