[package]
name = "cpah-docs"
version = "1.1.1"
description = "Watch folders, convert documents to Markdown, and build local knowledge indexes"
authors = ["lllcy"]
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/lllcy/cpah-docs"
readme = "../README.md"
publish = false

[lib]
name = "cpah_docs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
anytomd = { version = "1.3.1", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
dunce = "1"
keyring = "4.1.6"
notify = "8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rig = { version = "=0.41.0", default-features = false, features = ["agent", "derive", "rustls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "=0.10.0"
sha2 = "0.10"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
yaml-edit = { version = "=0.2.3", default-features = false }
zip = { version = "8.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
